<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Geoscientific AR Project</title>
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon-512.jpg">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        :root {
            --glass-bg: rgba(15, 20, 28, 0.72);
            --glass-border: rgba(255, 255, 255, 0.16);
            --accent: #00d2ff;
            --accent-green: #00e676;
            --ease-smooth: cubic-bezier(0.22, 1, 0.36, 1);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body { 
            margin: 0; overflow: hidden; background-color: #0b0f14; 
            touch-action: none; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: #fff;
        }

        /* Smooth Screen Overlay Transitions */
        .screen-layer {
            position: fixed; inset: 0;
            opacity: 0; visibility: hidden; pointer-events: none;
            transform: scale(1.03);
            transition: opacity 0.35s var(--ease-smooth), transform 0.35s var(--ease-smooth), visibility 0.35s;
        }
        .screen-layer.active {
            opacity: 1; visibility: visible; pointer-events: auto;
            transform: scale(1);
        }
        
        /* 1. Main Menu Screen */
        #menuScreen {
            background: radial-gradient(circle at 50% 25%, #1a2a3a 0%, #0b0f14 75%);
            display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 200;
            padding: 24px;
        }
        .menu-badge {
            font-size: 12px; font-weight: 700; letter-spacing: 1.4px; text-transform: uppercase;
            color: var(--accent); background: rgba(0, 210, 255, 0.12);
            border: 1px solid rgba(0, 210, 255, 0.3);
            padding: 6px 14px; border-radius: 20px; margin-bottom: 16px;
        }
        #menuScreen h1 { 
            color: #fff; margin: 0 0 10px 0; text-align: center; 
            font-size: 28px; font-weight: 700; letter-spacing: -0.5px;
        }
        .menu-subtitle {
            color: #9aa7b8; font-size: 14px; text-align: center;
            max-width: 300px; line-height: 1.5; margin-bottom: 36px;
        }
        .menu-btn {
            display: flex; align-items: center; justify-content: center; gap: 10px;
            background: linear-gradient(135deg, #007bff, #0056d6);
            color: white; border: 1px solid rgba(255, 255, 255, 0.18); border-radius: 14px;
            padding: 16px 24px; font-size: 17px; font-weight: 600; margin: 8px 0;
            width: 100%; max-width: 280px; cursor: pointer;
            box-shadow: 0 10px 25px rgba(0, 123, 255, 0.28);
            transition: transform 0.18s var(--ease-smooth), box-shadow 0.18s ease, background 0.2s ease;
        }
        .menu-btn.secondary {
            background: var(--glass-bg);
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.35);
        }
        .menu-btn:active {
            transform: scale(0.96);
        }

        /* 2. Map Selection Screen */
        #mapScreen { z-index: 150; background: #0b0f14; }
        #leafletMap { width: 100%; height: 100%; }
        
        .top-pill-btn {
            position: absolute;
            top: calc(14px + env(safe-area-inset-top));
            left: calc(14px + env(safe-area-inset-left));
            z-index: 1000;
            background: var(--glass-bg);
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            color: #fff; border: 1px solid var(--glass-border);
            padding: 9px 15px; border-radius: 12px;
            font-size: 14px; font-weight: 600; cursor: pointer;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.35);
            transition: transform 0.15s ease, opacity 0.25s ease;
        }
        .top-pill-btn:active { transform: scale(0.95); }

        #mapInstructions {
            position: absolute;
            top: calc(14px + env(safe-area-inset-top));
            right: calc(14px + env(safe-area-inset-right));
            background: var(--glass-bg);
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            color: #fff; padding: 9px 14px; border-radius: 12px;
            z-index: 1000; font-size: 13px; font-weight: 600;
            max-width: calc(100vw - 130px); text-align: right;
        }
        #confirmMapBtn {
            position: absolute;
            bottom: calc(28px + env(safe-area-inset-bottom));
            left: 50%; transform: translateX(-50%) translateY(15px);
            padding: 15px 34px; font-size: 17px; font-weight: 700;
            background: linear-gradient(135deg, #00c853, #009624);
            color: white; border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 14px; z-index: 1000; cursor: pointer;
            box-shadow: 0 10px 25px rgba(0, 200, 83, 0.35);
            opacity: 0; pointer-events: none;
            transition: opacity 0.25s var(--ease-smooth), transform 0.25s var(--ease-smooth);
        }
        #confirmMapBtn.visible {
            opacity: 1; pointer-events: auto;
            transform: translateX(-50%) translateY(0);
        }
        #confirmMapBtn:active { transform: translateX(-50%) scale(0.96); }

        /* 3. Loading Transition Overlay */
        #loadingOverlay {
            position: fixed; inset: 0; z-index: 250;
            background: rgba(11, 15, 20, 0.78);
            backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            opacity: 0; visibility: hidden; pointer-events: none;
            transition: opacity 0.25s ease, visibility 0.25s ease;
        }
        #loadingOverlay.active { opacity: 1; visibility: visible; pointer-events: auto; }
        .spinner {
            width: 38px; height: 38px; border-radius: 50%;
            border: 3px solid rgba(255, 255, 255, 0.15);
            border-top-color: var(--accent);
            animation: spin 0.8s linear infinite; margin-bottom: 14px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        #loadingText { font-size: 14px; font-weight: 600; color: #dbe4ee; letter-spacing: 0.3px; }

        /* 4. AR / 3D Scene Elements */
        #cameraFeed { 
            position: fixed; inset: 0; width: 100vw; height: 100vh; 
            object-fit: cover; z-index: -1; display: none; 
        }
        canvas { display: block; position: fixed; inset: 0; z-index: 1; }

        .ar-hud {
            opacity: 0; visibility: hidden;
            transition: opacity 0.35s var(--ease-smooth), visibility 0.35s;
        }
        .ar-hud.active { opacity: 1; visibility: visible; }
        
        /* Auto-stacking Left HUD Container */
        #leftHudColumn {
            position: absolute;
            top: calc(60px + env(safe-area-inset-top));
            left: calc(14px + env(safe-area-inset-left));
            width: min(290px, calc(100vw - 28px));
            display: flex; flex-direction: column; gap: 8px;
            z-index: 10; pointer-events: none;
        }

        #ui { 
            color: #ffffff;
            background: var(--glass-bg);
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            padding: 11px 14px; border-radius: 12px;
            line-height: 1.45; font-size: 13px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
        }
        
        #explanationBox {
            color: #f1f5f9;
            background: rgba(12, 18, 26, 0.85);
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-left: 4px solid var(--accent);
            padding: 10px 13px; border-radius: 12px;
            line-height: 1.4; font-size: 12.5px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.35);
            display: none;
            animation: slideUpFade 0.22s var(--ease-smooth);
        }
        @keyframes slideUpFade {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Compass UI */
        #compassBox {
            position: absolute;
            top: calc(14px + env(safe-area-inset-top));
            right: calc(14px + env(safe-area-inset-right));
            color: var(--accent-green);
            background: var(--glass-bg);
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            padding: 9px 14px; border-radius: 12px;
            font-weight: 700; font-size: 14px; font-variant-numeric: tabular-nums;
            z-index: 10; box-shadow: 0 4px 14px rgba(0, 0, 0, 0.3);
        }

        /* Collapsible Bottom Sliders Drawer */
        #bottomSliders { 
            position: absolute;
            bottom: calc(16px + env(safe-area-inset-bottom));
            left: 50%; transform: translateX(-50%);
            width: min(92vw, 460px);
            background: var(--glass-bg);
            backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
            border: 1px solid var(--glass-border);
            padding: 12px 16px; border-radius: 16px; color: white;
            z-index: 10; pointer-events: auto;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
            transition: transform 0.3s var(--ease-smooth), opacity 0.3s ease;
        }
        .drawer-header {
            display: flex; justify-content: space-between; align-items: center;
            cursor: pointer; user-select: none; padding-bottom: 2px;
        }
        .drawer-title {
            font-size: 12px; font-weight: 700; text-transform: uppercase;
            letter-spacing: 0.8px; color: #cbd5e1;
        }
        #toggleDrawerIcon {
            font-size: 12px; color: var(--accent); font-weight: 700;
            transition: transform 0.25s ease;
        }
        #slidersBody {
            overflow: hidden; max-height: 260px; margin-top: 10px;
            transition: max-height 0.3s var(--ease-smooth), margin-top 0.3s ease, opacity 0.25s ease;
            opacity: 1;
        }
        #bottomSliders.collapsed #slidersBody {
            max-height: 0; margin-top: 0; opacity: 0;
        }
        #bottomSliders.collapsed #toggleDrawerIcon {
            transform: rotate(180deg);
        }

        .slider-row { display: flex; flex-direction: column; margin-bottom: 12px; font-size: 13px; }
        .slider-row:last-child { margin-bottom: 0; }
        .slider-label-row { display: flex; justify-content: space-between; color: #e2e8f0; font-weight: 500; }
        .slider-val { color: var(--accent); font-weight: 700; font-variant-numeric: tabular-nums; }
        .slider-row input[type="range"] { 
            width: 100%; margin-top: 6px; accent-color: var(--accent); height: 5px;
        }
        
        /* Precision Reticle Crosshair */
        #crosshair {
            position: absolute; top: 50%; left: 50%; width: 22px; height: 22px;
            margin: -11px 0 0 -11px;
            border: 2px solid rgba(255, 255, 255, 0.75); border-radius: 50%;
            z-index: 10; pointer-events: none;
            transition: border-color 0.2s ease, transform 0.2s ease;
        }
        #crosshair::after {
            content: ""; position: absolute; top: 50%; left: 50%;
            width: 4px; height: 4px; margin: -2px 0 0 -2px;
            background: #fff; border-radius: 50%;
            transition: background 0.2s ease;
        }
        #crosshair.locked {
            border-color: var(--accent-green);
            transform: scale(1.12);
        }
        #crosshair.locked::after {
            background: var(--accent-green);
        }
    </style>
</head>
<body>
    <!-- 1. Main Menu -->
    <div id="menuScreen" class="screen-layer active">
        <div class="menu-badge">0.5m High-Res DTM</div>
        <h1>Hong Kong Geoscientific Explorer</h1>
        <p class="menu-subtitle">Real-time 3D lithological terrain overlay for geological field mapping.</p>
        <button class="menu-btn" id="btnLiveMode">Live AR Mode</button>
        <button class="menu-btn secondary" id="btnMapMode">Virtual Map Mode</button>
    </div>

    <!-- 2. Interactive Map Screen -->
    <div id="mapScreen" class="screen-layer">
        <button id="btnMapBack" class="top-pill-btn">← Menu</button>
        <div id="mapInstructions">Tap highlighted area to spawn</div>
        <div id="leafletMap"></div>
        <button id="confirmMapBtn">Spawn Here</button>
    </div>

    <!-- 3. Loading Transition Overlay -->
    <div id="loadingOverlay">
        <div class="spinner"></div>
        <div id="loadingText">Initializing terrain engine...</div>
    </div>

    <!-- 4. Main 3D / AR UI -->
    <button id="btnBack" class="top-pill-btn ar-hud">← Menu</button>
    <video id="cameraFeed" autoplay playsinline></video>
    
    <div id="leftHudColumn" class="ar-hud">
        <div id="ui">
            <div id="infoText">Aim at terrain...</div>
            <div id="gpsText" style="font-size: 0.85em; color:#94a3b8; margin-top: 4px;">GPS: Waiting...</div>
            <div id="fpsText" style="font-size: 0.85em; color:#facc15; margin-top: 2px;"></div>
        </div>
        <div id="explanationBox"></div>
    </div>
    
    <div id="compassBox" class="ar-hud">0° N</div>
    
    <div id="bottomSliders" class="ar-hud">
        <div class="drawer-header" id="drawerToggle">
            <span class="drawer-title">Field Controls</span>
            <span id="toggleDrawerIcon">▾</span>
        </div>
        <div id="slidersBody">
            <div class="slider-row">
                <div class="slider-label-row">
                    <label for="heightSlider">Camera Height</label>
                    <span class="slider-val">+<span id="heightVal">10</span>m</span>
                </div>
                <input type="range" id="heightSlider" min="2" max="300" step="2" value="10">
            </div>
            <div class="slider-row">
                <div class="slider-label-row">
                    <label for="viewDistance">Render Distance</label>
                    <span class="slider-val"><span id="distVal">800</span>m</span>
                </div>
                <input type="range" id="viewDistance" min="100" max="2000" step="50" value="800">
            </div>
            <div class="slider-row">
                <div class="slider-label-row">
                    <label for="opacitySlider">Terrain Opacity</label>
                    <span class="slider-val"><span id="opacityVal">0.65</span></span>
                </div>
                <input type="range" id="opacitySlider" min="0" max="1" step="0.05" value="0.65">
            </div>
        </div>
    </div>

    <div id="crosshair" class="ar-hud"></div>
    
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/DeviceOrientationControls.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/proj4js/2.9.0/proj4.js"></script>
    <script src="app.js?v=18"></script>

    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js')
            .then(() => console.log('PWA Service Worker registered'))
            .catch((err) => console.error('SW error:', err));
        });
      }
    </script>
</body>
</html>

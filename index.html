<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Geoscientific AR Explorer</title>
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon-512.jpg">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <!-- Google Fonts: Outfit & Material Symbols -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,1,0" rel="stylesheet">

    <!-- Leaflet CSS for the Open-Source Map -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        :root {
            --md-sys-color-background: #141518;
            --md-sys-color-surface: rgba(24, 26, 31, 0.82);
            --md-sys-color-surface-high: rgba(34, 37, 44, 0.90);
            --md-sys-color-on-surface: #E3E2E6;
            --md-sys-color-on-surface-variant: #C4C6D0;
            --md-sys-color-primary: #A8C7FA;
            --md-sys-color-on-primary: #062E6F;
            --md-sys-color-primary-container: #0842A0;
            --md-sys-color-on-primary-container: #D3E3FD;
            --md-sys-color-secondary-container: rgba(58, 63, 75, 0.85);
            --md-sys-color-on-secondary-container: #DCE2F9;
            --md-sys-color-tertiary: #6DD58C;
            --md-sys-color-outline: rgba(255, 255, 255, 0.14);
            --md-elevation-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            overflow: hidden;
            background-color: var(--md-sys-color-background);
            color: var(--md-sys-color-on-surface);
            touch-action: none;
            font-family: 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        .material-symbols-outlined {
            font-size: 20px;
            line-height: 1;
            vertical-align: middle;
        }

        /* 1. Main Menu Screen */
        #menuScreen {
            position: absolute;
            inset: 0;
            background-color: #16171A;
            background-image: linear-gradient(180deg, rgba(20, 21, 24, 0.55) 0%, rgba(20, 21, 24, 0.25) 50%, rgba(20, 21, 24, 0.85) 100%), url('background.jpg');
            background-size: cover;
            background-position: center;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: max(48px, env(safe-area-inset-top)) 24px max(48px, env(safe-area-inset-bottom));
            z-index: 200;
        }

        .menu-header {
            text-align: center;
            max-width: 340px;
        }

        .menu-chip {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(168, 199, 250, 0.14);
            color: var(--md-sys-color-primary);
            border: 1px solid rgba(168, 199, 250, 0.28);
            padding: 6px 14px;
            border-radius: 9999px;
            font-size: 12px;
            font-weight: 500;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            margin-bottom: 14px;
        }

        #menuScreen h1 {
            color: #FFFFFF;
            margin: 0;
            font-size: 30px;
            font-weight: 600;
            line-height: 1.2;
            letter-spacing: -0.02em;
        }

        .menu-subtitle {
            color: var(--md-sys-color-on-surface-variant);
            font-size: 14px;
            font-weight: 400;
            margin-top: 8px;
        }

        .menu-actions {
            display: flex;
            flex-direction: column;
            gap: 14px;
            width: 100%;
            max-width: 300px;
        }

        .menu-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            border: none;
            border-radius: 9999px;
            padding: 16px 24px;
            font-family: 'Outfit', sans-serif;
            font-size: 16px;
            font-weight: 600;
            letter-spacing: 0.01em;
            cursor: pointer;
            transition: transform 0.15s ease, filter 0.15s ease;
            box-shadow: var(--md-elevation-shadow);
        }

        .menu-btn:active {
            transform: scale(0.97);
        }

        .menu-btn-primary {
            background-color: var(--md-sys-color-primary);
            color: var(--md-sys-color-on-primary);
        }

        .menu-btn-tonal {
            background-color: var(--md-sys-color-secondary-container);
            color: var(--md-sys-color-on-secondary-container);
            border: 1px solid var(--md-sys-color-outline);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }

        /* 2. Map Selection Screen */
        #mapScreen {
            position: absolute;
            inset: 0;
            display: none;
            z-index: 150;
        }

        #leafletMap {
            width: 100%;
            height: 100%;
        }

        #mapTopBar {
            position: absolute;
            top: max(16px, env(safe-area-inset-top));
            left: 16px;
            right: 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            z-index: 1000;
            pointer-events: none;
        }

        #btnMapBack {
            pointer-events: auto;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 44px;
            height: 44px;
            border-radius: 9999px;
            background: var(--md-sys-color-surface-high);
            color: var(--md-sys-color-on-surface);
            border: 1px solid var(--md-sys-color-outline);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            box-shadow: var(--md-elevation-shadow);
            cursor: pointer;
        }

        #mapInstructions {
            pointer-events: none;
            flex: 1;
            text-align: center;
            background: var(--md-sys-color-surface-high);
            color: var(--md-sys-color-on-surface);
            border: 1px solid var(--md-sys-color-outline);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 11px 18px;
            border-radius: 9999px;
            font-size: 14px;
            font-weight: 500;
            box-shadow: var(--md-elevation-shadow);
        }

        #confirmMapBtn {
            position: absolute;
            bottom: max(36px, env(safe-area-inset-bottom));
            left: 50%;
            transform: translateX(-50%);
            display: none;
            align-items: center;
            gap: 8px;
            padding: 16px 32px;
            font-family: 'Outfit', sans-serif;
            font-size: 16px;
            font-weight: 600;
            background-color: var(--md-sys-color-primary);
            color: var(--md-sys-color-on-primary);
            border: none;
            border-radius: 9999px;
            box-shadow: var(--md-elevation-shadow);
            z-index: 1000;
            cursor: pointer;
        }

        #confirmMapBtn:active {
            transform: translateX(-50%) scale(0.97);
        }

        /* 3. AR / 3D Scene Elements */
        #cameraFeed {
            position: absolute;
            inset: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            z-index: -1;
            display: none;
        }

        canvas {
            display: block;
            position: absolute;
            inset: 0;
            z-index: 1;
        }

        /* Top Navigation & Compass Pills */
        #btnBack {
            position: absolute;
            top: max(14px, env(safe-area-inset-top));
            left: 14px;
            z-index: 30;
            display: none;
            align-items: center;
            gap: 6px;
            background: var(--md-sys-color-surface);
            color: var(--md-sys-color-on-surface);
            border: 1px solid var(--md-sys-color-outline);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            padding: 9px 16px;
            border-radius: 9999px;
            font-family: 'Outfit', sans-serif;
            font-size: 14px;
            font-weight: 500;
            box-shadow: var(--md-elevation-shadow);
            cursor: pointer;
        }

        #btnBack:active {
            transform: scale(0.96);
        }

        #compassBox {
            position: absolute;
            top: max(14px, env(safe-area-inset-top));
            right: 14px;
            display: none;
            align-items: center;
            gap: 6px;
            color: var(--md-sys-color-tertiary);
            background: var(--md-sys-color-surface);
            border: 1px solid var(--md-sys-color-outline);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            padding: 9px 16px;
            border-radius: 9999px;
            font-weight: 600;
            font-size: 14px;
            letter-spacing: 0.03em;
            box-shadow: var(--md-elevation-shadow);
            z-index: 10;
        }

        /* Telemetry & Geology Cards */
        #hudStack {
            position: absolute;
            top: calc(max(14px, env(safe-area-inset-top)) + 50px);
            left: 14px;
            right: 14px;
            max-width: 340px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            z-index: 10;
            pointer-events: none;
        }

        #ui {
            background: var(--md-sys-color-surface);
            color: var(--md-sys-color-on-surface);
            border: 1px solid var(--md-sys-color-outline);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            padding: 14px 16px;
            border-radius: 20px;
            line-height: 1.45;
            box-shadow: var(--md-elevation-shadow);
            display: none;
        }

        .status-row {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 8px;
            margin-top: 8px;
            padding-top: 8px;
            border-top: 1px solid var(--md-sys-color-outline);
            font-size: 11.5px;
            color: var(--md-sys-color-on-surface-variant);
        }

        #fpsText {
            color: var(--md-sys-color-primary);
            font-weight: 600;
        }

        #strideText {
            color: var(--md-sys-color-tertiary);
            font-weight: 500;
        }

        #explanationBox {
            background: var(--md-sys-color-surface-high);
            color: var(--md-sys-color-on-surface);
            border: 1px solid var(--md-sys-color-outline);
            border-left: 4px solid var(--md-sys-color-primary);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            padding: 12px 16px;
            border-radius: 16px;
            line-height: 1.4;
            font-size: 13.5px;
            box-shadow: var(--md-elevation-shadow);
            display: none;
        }

        /* Bottom Control Sheet */
        #bottomSliders {
            position: absolute;
            bottom: max(16px, env(safe-area-inset-bottom));
            left: 50%;
            transform: translateX(-50%);
            width: calc(100% - 28px);
            max-width: 440px;
            background: var(--md-sys-color-surface);
            border: 1px solid var(--md-sys-color-outline);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            padding: 14px 18px 16px;
            border-radius: 24px;
            color: var(--md-sys-color-on-surface);
            box-shadow: var(--md-elevation-shadow);
            z-index: 10;
            pointer-events: auto;
            display: none;
        }

        .sheet-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            user-select: none;
        }

        .sheet-title {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            color: var(--md-sys-color-on-surface-variant);
        }

        #sheetToggleIcon {
            color: var(--md-sys-color-on-surface-variant);
            transition: transform 0.2s ease;
        }

        #bottomSliders.collapsed #sheetToggleIcon {
            transform: rotate(180deg);
        }

        #slidersBody {
            margin-top: 12px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        #bottomSliders.collapsed #slidersBody {
            display: none;
        }

        .slider-row {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .slider-label-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13.5px;
            font-weight: 500;
        }

        .slider-badge {
            background: rgba(168, 199, 250, 0.16);
            color: var(--md-sys-color-primary);
            padding: 2px 10px;
            border-radius: 9999px;
            font-size: 12.5px;
            font-weight: 600;
        }

        /* Material 3 Custom Range Input */
        input[type="range"] {
            -webkit-appearance: none;
            appearance: none;
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.18);
            border-radius: 9999px;
            outline: none;
            margin: 4px 0;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: var(--md-sys-color-primary);
            border: 3px solid #141518;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.45);
            cursor: pointer;
        }

        input[type="range"]::-moz-range-thumb {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: var(--md-sys-color-primary);
            border: 3px solid #141518;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.45);
            cursor: pointer;
        }

        /* Precision Reticle Crosshair */
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 22px;
            height: 22px;
            margin: -11px 0 0 -11px;
            border: 2px solid var(--md-sys-color-tertiary);
            border-radius: 50%;
            box-shadow: 0 0 10px rgba(109, 213, 140, 0.45);
            z-index: 10;
            pointer-events: none;
            display: none;
        }

        #crosshair::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 4px;
            height: 4px;
            margin: -2px 0 0 -2px;
            background: var(--md-sys-color-tertiary);
            border-radius: 50%;
        }
    </style>
</head>
<body>
    <!-- 1. Main Menu -->
    <div id="menuScreen">
        <div class="menu-header">
            <div class="menu-chip">
                <span class="material-symbols-outlined" style="font-size: 15px;">terrain</span>
                5m DTM · 1:20k Geology
            </div>
            <h1>Hong Kong Geoscientific Explorer</h1>
            <div class="menu-subtitle">Augmented Reality &amp; 3D Lithological Field Mapping</div>
        </div>

        <div class="menu-actions">
            <button class="menu-btn menu-btn-primary" id="btnLiveMode">
                <span class="material-symbols-outlined">view_in_ar</span>
                Live AR Mode
            </button>
            <button class="menu-btn menu-btn-tonal" id="btnMapMode">
                <span class="material-symbols-outlined">explore</span>
                Virtual Map Mode
            </button>
        </div>
    </div>

    <!-- 2. Interactive Map Screen -->
    <div id="mapScreen">
        <div id="mapTopBar">
            <button id="btnMapBack" aria-label="Back to menu">
                <span class="material-symbols-outlined">arrow_back</span>
            </button>
            <div id="mapInstructions">Tap map to select spawn point</div>
        </div>
        <div id="leafletMap"></div>
        <button id="confirmMapBtn">
            <span class="material-symbols-outlined">pin_drop</span>
            Spawn Here
        </button>
    </div>

    <!-- 3. Main 3D / AR UI -->
    <button id="btnBack">
        <span class="material-symbols-outlined" style="font-size: 18px;">arrow_back</span>
        Menu
    </button>
    <video id="cameraFeed" autoplay playsinline></video>
    
    <div id="compassBox">
        <span class="material-symbols-outlined" style="font-size: 17px;">explore</span>
        <span id="compassText">0° N</span>
    </div>

    <div id="hudStack">
        <div id="ui">
            <div id="infoText">Awaiting initialization...</div>
            <div class="status-row">
                <span id="gpsText">GPS: Waiting...</span>
                <span>•</span>
                <span id="fpsText">-- fps</span>
                <span id="strideText"></span>
            </div>
        </div>
        
        <div id="explanationBox"></div>
    </div>
    
    <div id="bottomSliders">
        <div class="sheet-header" id="sheetToggle">
            <div class="sheet-title">
                <span class="material-symbols-outlined" style="font-size: 18px;">tune</span>
                Terrain &amp; View Controls
            </div>
            <span class="material-symbols-outlined" id="sheetToggleIcon">expand_more</span>
        </div>

        <div id="slidersBody">
            <div class="slider-row">
                <div class="slider-label-row">
                    <label for="heightSlider">Camera Height</label>
                    <span class="slider-badge">+<span id="heightVal">10</span> m</span>
                </div>
                <input type="range" id="heightSlider" min="2" max="300" step="2" value="10">
            </div>
            <div class="slider-row">
                <div class="slider-label-row">
                    <label for="viewDistance">Render Distance</label>
                    <span class="slider-badge"><span id="distVal">3000</span> m</span>
                </div>
                <input type="range" id="viewDistance" min="500" max="15000" step="500" value="3000">
            </div>
            <div class="slider-row">
                <div class="slider-label-row">
                    <label for="opacitySlider">Terrain Opacity</label>
                    <span class="slider-badge"><span id="opacityVal">0.65</span></span>
                </div>
                <input type="range" id="opacitySlider" min="0" max="1" step="0.05" value="0.65">
            </div>
        </div>
    </div>

    <div id="crosshair"></div>
    
    <!-- Scripts -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/DeviceOrientationControls.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/proj4js/2.9.0/proj4.js"></script>
    <script src="app.js?v=15"></script>

    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js')
            .then(() => console.log('PWA Service Worker registered'))
            .catch((err) => console.error('SW error:', err));
        });
      }
    </script>
</body>
</html>
